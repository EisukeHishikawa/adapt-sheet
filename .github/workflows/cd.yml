# mainマージ後の本番デプロイ。
# AWSの長期アクセスキーは持たず、OIDCで発行される短期認証情報でデプロイロール
# （infra/modules/github_oidc）を引き受ける。
#
# 前提: infra/bootstrap と infra/ の初回 apply はローカルから手動で実施済みであること
# （ECRリポジトリとLambdaが存在しない状態ではイメージのpushもLambda更新もできないため）。
# 手順は docs/deployment.md を参照。
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時に走らせるとTerraformのstateロックで後発が失敗するため、直列化する。
# 進行中のデプロイを途中で止める方が危険なのでcancel-in-progressはしない。
concurrency:
  group: cd-prod
  cancel-in-progress: false

permissions:
  id-token: write # OIDCトークンの発行に必須
  contents: read

env:
  AWS_REGION: ap-northeast-1
  TF_IN_AUTOMATION: "true"

jobs:
  # イメージのタグを決める。タグをコミットSHAではなく「そのサービスのビルドコンテキストを
  # 最後に変更したコミット」にすることで、中身が変わっていないサービスは既存イメージを
  # そのまま指し、ビルドとpushを丸ごと省ける（doclingのpushだけで5分近くかかるため）。
  # このjobがスキップされると後続も連鎖してスキップされる。
  plan:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tags.outputs.matrix }}
      backend_tag: ${{ steps.tags.outputs.backend }}
      docling_tag: ${{ steps.tags.outputs.docling }}
      pdf2htmlex_tag: ${{ steps.tags.outputs.pdf2htmlex }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git logでパスごとの最終変更コミットを引くため全履歴が要る

      - name: Resolve image tags
        id: tags
        run: |
          set -euo pipefail
          entries=""
          for svc in backend docling pdf2htmlex; do
            case "$svc" in
              backend) ctx=backend ;;
              docling) ctx=docling-service ;;
              pdf2htmlex) ctx=pdf2htmlex-service ;;
            esac
            # Dockerfile.lambdaもコンテキスト内にあるため、この1パスの追跡で漏れは出ない。
            tag="$(git log -1 --format=%H -- "$ctx")"
            : "${tag:=${{ github.sha }}}"
            echo "${svc}=${tag}" >> "$GITHUB_OUTPUT"
            entries="${entries}{\"svc\":\"${svc}\",\"ctx\":\"${ctx}\",\"tag\":\"${tag}\"},"
          done
          echo "matrix={\"include\":[${entries%,}]}" >> "$GITHUB_OUTPUT"

  # Lambdaのイメージは同一リージョンのECR Privateからのみ取得できる。3サービスを並列に
  # 処理し、直列の合計ではなく最長のサービス（docling）の時間で済むようにする。
  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # 同じタグのイメージが既にあるなら中身も同一なので作り直さない。
      # apt-get/pip installのレイヤーはビルドのたびに別ダイジェストになり、
      # 中身が同じでもpushで数GBを再送してしまうため、ここで止める意味が大きい。
      - name: Check existing image
        id: check
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          if aws ecr describe-images \
              --repository-name "adapt-sheet-prod-${{ matrix.svc }}" \
              --image-ids "imageTag=${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "adapt-sheet-prod-${{ matrix.svc }}:${TAG} は既にECRにあるためビルドを省略する"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.check.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/adapt-sheet-prod-${{ matrix.svc }}:${TAG}"
          docker build -f "${{ matrix.ctx }}/Dockerfile.lambda" -t "$image" "${{ matrix.ctx }}"
          docker push "$image"

  deploy:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # 本番マイグレーション未適用のままデプロイが進み、新しいコードが存在しないテーブルに
      # アクセスして落ちる事故を防ぐ。DDL・RLS設定には所有者権限が要るため、実行時用の
      # DATABASE_URL（authenticator/制限ロール）とは別にMIGRATION_DATABASE_URL（postgresロール）を使う。
      - name: Run database migrations
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ needs.plan.outputs.backend_tag }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          docker run --rm --entrypoint alembic \
            -e MIGRATION_DATABASE_URL \
            "${REGISTRY}/adapt-sheet-prod-backend:${TAG}" upgrade head

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # stateの置き場は環境ごとに差し替えられるよう、コードへ直書きせずinit時に渡す。
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      # 実tfvarsはコミットしないため、既定値と異なる値だけをTF_VAR_で渡す。
      - name: Terraform apply
        working-directory: infra
        env:
          TF_VAR_image_tag: ${{ needs.plan.outputs.backend_tag }}
          TF_VAR_docling_image_tag: ${{ needs.plan.outputs.docling_tag }}
          TF_VAR_pdf2htmlex_image_tag: ${{ needs.plan.outputs.pdf2htmlex_tag }}
          TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_state_lock_table_name: ${{ vars.TF_STATE_LOCK_TABLE }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_supabase_jwt_jwks_url: ${{ vars.SUPABASE_JWT_JWKS_URL }}
          TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
          # OIDCプロバイダはアカウントに1つしか作れない。既存を流用する場合はfalseを設定する。
          TF_VAR_create_github_oidc_provider: ${{ vars.CREATE_GITHUB_OIDC_PROVIDER || 'true' }}
        run: terraform apply -auto-approve -input=false

      - name: Read terraform outputs
        id: tf
        working-directory: infra
        run: |
          set -euo pipefail
          {
            echo "bucket=$(terraform output -raw frontend_bucket_name)"
            echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)"
            echo "app_url=$(terraform output -raw app_url)"
          } >> "$GITHUB_OUTPUT"

      # Lambdaのイメージを差し替えた直後は各サービスがコールドスタートし、docling（ML推論の
      # 初期化）だけで1分以上かかる。フロントのビルドと配信の裏で先に起こしておき、
      # 最後のスモークテストがコールドスタートの完了を待つだけの時間を無くす。
      # 失敗しても後続には影響しない（成否は最後のスモークテストが判定する）。
      - name: Start warming up services
        env:
          APP_URL: ${{ steps.tf.outputs.app_url }}
        run: |
          nohup bash -c 'for _ in $(seq 1 20); do
            curl -sSf -X POST "$APP_URL/api/warmup" >/dev/null 2>&1 && break
            sleep 5
          done' >/dev/null 2>&1 &
          echo "ウォームアップをバックグラウンドで開始した: $APP_URL"

      # VITE_SUPABASE_*はビルド時に埋め込まれるため、配信前のここで注入する。
      # ローカル/CIと同じdocker-compose.ymlのfrontendサービスでビルドし、成果物を揃える。
      - name: Build frontend
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          docker compose build frontend
          docker compose run --rm --no-deps frontend npm run build

      # index.htmlは常に最新を配りたいのでキャッシュさせず、ハッシュ付きの静的アセットは長期キャッシュする。
      - name: Upload frontend to S3
        env:
          BUCKET: ${{ steps.tf.outputs.bucket }}
        run: |
          set -euo pipefail
          aws s3 sync frontend/dist "s3://${BUCKET}/" --delete \
            --exclude "index.html" --cache-control "public,max-age=31536000,immutable"
          aws s3 cp frontend/dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ steps.tf.outputs.distribution_id }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'

      # SPAが配信され、backendからdocling/pdf2htmlex/DBまで到達できることを確認する。
      # /api/warmupは各サービスの状態をJSONで返し、認証を要求しない。
      # 直前のウォームアップが間に合わなかった場合に備えてリトライは残す。待ち時間の
      # 刻みを細かくして、起動済みなのに次の試行まで待つ無駄を減らす。
      - name: Smoke test
        env:
          APP_URL: ${{ steps.tf.outputs.app_url }}
        run: |
          set -euo pipefail
          curl -sSf -o /dev/null "$APP_URL/"
          for _ in $(seq 1 15); do
            if curl -sSf -X POST "$APP_URL/api/warmup" | tee /dev/stderr | grep -q '"docling"'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
