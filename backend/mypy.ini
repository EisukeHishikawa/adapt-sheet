[mypy]
python_version = 3.9
# Pydanticのフィールド別名・バリデータをmypyへ伝える公式プラグイン。
plugins = pydantic.mypy

# boto3/botocore/PyMuPDFは型スタブを同梱せず、公式スタブも重量級のため導入しない。
# 呼び出し側の型注釈で境界を固める方針とし、これらのimportのみ解析対象外にする。
[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-fitz]
ignore_missing_imports = True
